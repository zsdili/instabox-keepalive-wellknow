name: InstaBox Keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Renew activity lease
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
        run: |
          set -eu
          [ -n "$INSTABOX_API_KEY" ] || { echo "Missing secret INSTABOX_API_KEY"; exit 1; }
          API="https://api.instabox.sh"
          echo "== $(date -u +%FT%TZ) keepalive start =="
          machines=$(curl -fsS -m 30 -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines")
          ids=$(printf '%s' "$machines" | jq -r '.[].id')
          [ -n "$ids" ] || { echo "No machines found"; exit 1; }
          fail=0
          for id in $ids; do
            name=$(printf '%s' "$machines" | jq -r --arg id "$id" '.[] | select(.id==$id) | .name')
            state=$(printf '%s' "$machines" | jq -r --arg id "$id" '.[] | select(.id==$id) | .state')
            echo "machine: $name ($id) state: $state"
            if [ "$state" != "running" ]; then
              echo "  not running, resuming..."
              curl -fsS -m 30 -X POST -H "X-API-Key: $INSTABOX_API_KEY" "$API/v1/machines/$id/resume" >/dev/null 2>&1 || true
              sleep 8
            fi
            code=$(curl -sS -m 30 -o /tmp/lease.out -w '%{http_code}' \
              -X PUT -H "X-API-Key: $INSTABOX_API_KEY" -H 'Content-Type: application/json' \
              -d '{"ttlSeconds":900}' \
              "$API/v1/machines/$id/activity-leases/keepalive" || echo 000)
            echo "  lease HTTP $code: $(cat /tmp/lease.out)"
            [ "$code" = "200" ] || [ "$code" = "204" ] || fail=1
          done
          [ "$fail" -eq 0 ] || { echo "some renewals failed"; exit 1; }
          echo "== all machines renewed =="
